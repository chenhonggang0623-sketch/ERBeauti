[project]
name = "erbeauti"
version = "0.1.0"
description = "ERBeauti backend - database reverse-engineering service and CLI"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [
    { name = "ERBeauti Team" },
]
keywords = ["er-diagram", "database", "reverse-engineering", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "sqlalchemy>=2.0.36",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9.10"]
mysql = ["pymysql>=1.1.1", "cryptography>=44.0.0"]
sqlserver = ["pyodbc>=5.2.0"]
oracle = ["oracledb>=2.5.0"]
all = [
    "psycopg2-binary>=2.9.10",
    "pymysql>=1.1.1",
    "cryptography>=44.0.0",
    "pyodbc>=5.2.0",
    "oracledb>=2.5.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
erbeauti-cli = "erbeauti.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["erbeauti"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"erbeauti/models.py" = ["N815"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
